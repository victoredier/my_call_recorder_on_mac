  <!-- Cradle Arc -->
  <path d="M 12.5, 18.5 C 12.5, 25 16.5, 28 22, 28 C 27.5, 28 31.5, 25 31.5, 18.5"
        fill="none" stroke="#000000" stroke-width="2.6" stroke-linecap="round" />
        
  <!-- Stem & Base Foot -->
